<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Ollie's face, from the grin pose: black head, white muzzle, pink tongue. -->
  <g stroke="#141416" stroke-width="2.5" stroke-linejoin="round">
    <!-- ears -->
    <path d="M9 30 C6 16 9 6 15 4 C21 8 24 16 24 22 Z" fill="#2b2b30" />
    <path d="M55 30 C58 16 55 6 49 4 C43 8 40 16 40 22 Z" fill="#2b2b30" />
    <path d="M13 24 C12 16 13 10 16 8 C19 12 20 16 20 20 Z" fill="#9b7b84" stroke="none" />
    <path d="M51 24 C52 16 51 10 48 8 C45 12 44 16 44 20 Z" fill="#9b7b84" stroke="none" />
    <!-- head -->
    <ellipse cx="32" cy="36" rx="24" ry="22" fill="#2b2b30" />
    <!-- white muzzle and blaze -->
    <path d="M28 18 C30 24 30 30 32 32 C34 30 34 24 36 18 Z" fill="#ffffff" stroke="none" />
    <ellipse cx="32" cy="45" rx="15" ry="11" fill="#ffffff" />
    <!-- eyes -->
    <circle cx="21" cy="32" r="5" fill="#ffffff" />
    <circle cx="43" cy="32" r="5" fill="#ffffff" />
  </g>
  <circle cx="22" cy="32.5" r="2.6" fill="#141416" />
  <circle cx="42" cy="32.5" r="2.6" fill="#141416" />
  <!-- nose and grin -->
  <ellipse cx="32" cy="39" rx="5" ry="3.3" fill="#141416" />
  <path d="M22 45 C26 52 38 52 42 45 Z" fill="#141416" />
  <!-- tongue -->
  <path d="M28 48 C28 58 36 58 36 48 Z" fill="#f08a96" stroke="#141416" stroke-width="2" stroke-linejoin="round" />
  <path d="M32 49 L32 54" stroke="#c45d6b" stroke-width="1.3" stroke-linecap="round" />
</svg>
