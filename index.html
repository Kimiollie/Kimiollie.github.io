<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
    />
    <title>Kim Ngan Tran</title>
    <script>
      // Set day/night before the first paint (same rules as src/theme/dayNight.ts).
      (function () {
        var theme;
        try {
          theme = sessionStorage.getItem('ollie-theme');
        } catch (e) {}
        if (theme !== 'day' && theme !== 'night') {
          var hour = new Date().getHours();
          theme = hour >= 7 && hour < 18 ? 'day' : 'night';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
